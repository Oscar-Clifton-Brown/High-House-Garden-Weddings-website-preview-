<body>
    <my-header></my-header>

        <div id="title-wrapper1"></div>
        <p class = "p1">High House Garden Weddings</p>
        <p class = "p2">NORFOLK</p>
    </div>

    <div class="thirds-grid">
        <img src="assets/photos/wall_in_backgruond.jpg" alt="the walled garden" class = "thirds-item-1" id = "img1">
        <div class="text-container-centre titelized thirds-item-2" id = "txt1">
            <div id="txt1_1-wrapper">
                <p class="p1 text-in" id = "txt1_1">experience the magic of the walled garden at high house</p>
            </div>
            <div id="txt1_2-wrapper">
                <a href="the_walled_garden" class="button non-button-button text-in" id = "txt1_2">the walled garden</a>
            </div>
        </div>

        <div class="text-container-centre titelized thirds-item-3" id = "txt2">
            <div id="txt2_1-wrapper">
                <p class="p1 text-in" id = "txt2_1">acres of romance are exclusively yours</p>
            </div>

            <div id="txt2_2-wrapper">
                <a href="the_venue" class="button non-button-button text-in" id = "txt2_2">the venue</a>
            </div>

        </div>
        <img src="assets/photos/walking_with_wall.jpg" alt="the on site accomodation" class="thirds-item-4" id = "img2">

            </div>

                <a href="accommodation" class="button non-button-button text-in" id = "txt3_2">accommodation</a>
             </div>

    </div>

    <my-footer></my-footer>
    <script src="js/main.js"></script>
    <script>
        document.getElementById("home").classList.add("this-page");
        
        function alignelements() {
            do {
                document.getElementById("img1").style.height = document.getElementById("txt1").clientHeight + "px"; 
                document.getElementById("img2").style.height = document.getElementById("txt2").clientHeight + "px"; 
                document.getElementById("img3").style.height = document.getElementById("txt3").clientHeight + "px"; 
            }
            while (document.getElementById("img1").style.height != document.getElementById("txt1").clientHeight + "px");
        };
        document.getElementById("img1").addEventListener("load",alignelements);
        document.getElementById("img2").addEventListener("load",alignelements);
        document.getElementById("img3").addEventListener("load",alignelements);
        window.addEventListener("resize",alignelements);
   </script>
